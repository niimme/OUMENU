name: Update Dining Menus

on:
  schedule:
    # Runs every Monday at 11:00 AM Central Time (16:00 UTC / Norman, OK)
    - cron: '0 16 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape latest menus
        run: |
          python3 scrape_menus.py

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          if git status --porcelain data/menu_data.json | grep -q 'data/menu_data.json'; then
            echo "New menu data detected. Committing and pushing..."
            git add data/menu_data.json
            git commit -m "Auto-update dining menus [skip ci]"
            git push
          else
            echo "No changes in menu data. Skipping commit."
          fi
